<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProJoelho | Links</title>
<meta name="description" content="Mais conforto, suporte e proteção para seus joelhos no dia a dia.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #4dff1f;
    --black: #050805;
    --ink: #050805;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: var(--black);
  }
  /* Gradiente fixo: do preto ao verde neon */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(175deg, #000 0%, #030a03 30%, #0b3d0e 62%, #2fd514 86%, #4dff1f 100%);
  }
  main {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px 28px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: min(66%, 260px);
    aspect-ratio: 1;
    border-radius: 50%;
    filter: drop-shadow(0 0 22px rgba(77, 255, 31, .45));
    animation: drop .7s cubic-bezier(.2, .8, .2, 1) both;
  }
  .logo img { display: block; width: 100%; height: 100%; border-radius: 50%; }
  h1 {
    margin-top: 24px;
    font-size: clamp(1.8rem, 7vw, 2.2rem);
    font-weight: 800;
    text-align: center;
    letter-spacing: -.01em;
    animation: fade .7s .1s both;
  }
  h1 span { color: var(--neon); }
  .tagline {
    margin-top: 8px;
    max-width: 21em;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
    color: #eaffe4;
    animation: fade .7s .2s both;
  }
  ul { list-style: none; width: 100%; margin-top: 32px; display: grid; gap: 14px; }
  .item { opacity: 0; animation: rise .6s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(.35s + var(--i) * .1s); }
  .btn {
    display: grid;
    grid-template-columns: 48px 1fr 48px;
    align-items: center;
    gap: 6px;
    padding: 12px 14px;
    min-height: 72px;
    background: rgba(5, 8, 5, .88);
    color: #fff;
    border: 1.5px solid rgba(77, 255, 31, .75);
    border-radius: 22px;
    text-decoration: none;
    box-shadow: 0 0 14px rgba(77, 255, 31, .18), 0 6px 18px rgba(0, 0, 0, .4);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background-color .22s ease;
  }
  .btn:hover { transform: translateY(-3px); background: #000; border-color: var(--neon); box-shadow: 0 0 24px rgba(77, 255, 31, .5), 0 12px 26px rgba(0, 0, 0, .45); }
  .btn:active { transform: translateY(0) scale(.99); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .ico {
    width: 48px; height: 48px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: var(--neon);
    color: var(--ink);
  }
  .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .txt { display: grid; text-align: center; gap: 1px; min-width: 0; }
  .txt strong { font-size: 1.12rem; font-weight: 800; }
  .txt small { font-size: .86rem; font-weight: 500; color: #b9f5ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer {
    margin-top: auto;
    padding-top: 36px;
    font-size: .85rem;
    font-weight: 800;
    color: var(--ink);
    text-align: center;
    animation: fade .7s 1.1s both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .logo, h1, .tagline, footer { animation: none; }
    .item { animation: none; opacity: 1; }
    .btn { transition: none; }
  }
</style>
</head>
